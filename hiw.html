<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIW 听力跟读练习 — 大骐英语</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#fff; --bg-alt:#f6f8fa; --fg:#1f2328; --fg-soft:#59636e; --fg-mute:#848e98;
      --line:#d1d9e0; --line-soft:#eaeef2; --accent:#1f6feb;
      --green:#1a7f37; --green-bg:#dafbe1; --green-bd:#aceebb;
      --red:#cf222e;   --red-bg:#ffebe9;   --red-bd:#ffcecb;
      --yellow:#9a6700; --yellow-bg:#fff8c5; --yellow-bd:#f3e08a;
      --karaoke:#fff3b0;
      --radius:10px;
      --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--fg);
         font-size:15px;-webkit-font-smoothing:antialiased;}

    /* ── Nav ── */
    .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
         padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .nav a{color:var(--fg);font-weight:600;text-decoration:none;font-size:15px;}
    .nav a.muted{color:var(--fg-soft);font-weight:500;}
    .nav-sep{color:var(--fg-mute);}
    .nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .badge{background:var(--bg-alt);border:1px solid var(--line);border-radius:20px;
           padding:3px 10px;font-size:13px;font-weight:500;color:var(--fg-soft);}
    .badge b{color:var(--fg);}

    /* ── Layout ── */
    .layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 50px);}

    /* ── Sidebar ── */
    .sidebar{border-right:1px solid var(--line-soft);background:var(--bg-alt);
             position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;
             display:flex;flex-direction:column;}
    .sidebar-hdr{padding:14px 16px 8px;border-bottom:1px solid var(--line-soft);background:var(--bg-alt);
                 position:sticky;top:0;z-index:1;}
    .search-wrap{position:relative;}
    .search{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;
            background:#fff;font-family:var(--font);font-size:13px;outline:none;}
    .search:focus{border-color:var(--accent);}
    .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);
                 width:14px;height:14px;color:var(--fg-mute);pointer-events:none;}
    .sidebar-title{font-size:11px;font-weight:600;color:var(--fg-mute);letter-spacing:.08em;
                   text-transform:uppercase;padding:12px 16px 6px;}
    .topic-list{flex:1;overflow-y:auto;}
    .topic-row{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;
               border-left:3px solid transparent;font-size:14px;color:var(--fg-soft);
               transition:background .1s,border-color .1s;}
    .topic-row:hover{background:var(--line-soft);}
    .topic-row.active{background:#fff;border-left-color:var(--accent);color:var(--fg);font-weight:600;}
    .topic-row .t-num{font-size:11px;color:var(--fg-mute);font-weight:500;flex-shrink:0;
                      min-width:22px;text-align:right;}
    .topic-row .t-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .topic-row .t-status{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--bg-alt);
                         color:var(--fg-mute);flex-shrink:0;border:1px solid var(--line);}
    .topic-row.done .t-status{background:var(--green-bg);color:var(--green);border-color:var(--green-bd);}

    /* ── Main ── */
    .main{padding:24px 32px 80px;max-width:920px;}

    /* ── Topic header ── */
    .topic-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
    .topic-title{font-size:22px;font-weight:700;letter-spacing:-.02em;}
    .pill{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--line-soft);
          color:var(--fg-soft);font-weight:500;}
    .pill.easy{background:var(--green-bg);color:var(--green);}
    .pill.medium{background:var(--yellow-bg);color:var(--yellow);}
    .pill.hard{background:var(--red-bg);color:var(--red);}

    /* ── Stats ── */
    .stats{display:flex;gap:10px;margin-bottom:18px;}
    .stat{flex:1;padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;text-align:center;}
    .stat-num{font-size:18px;font-weight:700;}
    .stat-label{font-size:11px;color:var(--fg-mute);margin-top:2px;}
    .stat.g .stat-num{color:var(--green);}
    .stat.r .stat-num{color:var(--red);}
    .stat.y .stat-num{color:var(--yellow);}

    /* ── Audio zone ── */
    .audio-zone{display:flex;align-items:center;gap:14px;padding:14px 18px;
                background:var(--bg-alt);border-radius:10px;border:1px solid var(--line-soft);
                margin-bottom:20px;}
    .play-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
              background:var(--fg);color:#fff;display:flex;align-items:center;justify-content:center;
              flex-shrink:0;transition:transform .15s,background .15s;}
    .play-btn:hover{background:#000;transform:scale(1.06);}
    .play-btn:disabled{background:var(--fg-mute);cursor:not-allowed;transform:none;}
    .play-btn svg{width:18px;height:18px;}
    .audio-meta{font-size:13px;color:var(--fg-soft);min-width:0;flex:1;}
    .audio-time{font-variant-numeric:tabular-nums;color:var(--fg-mute);font-size:12px;}
    .seek-bar{width:100%;height:4px;background:var(--line-soft);border-radius:3px;
              overflow:hidden;margin-top:6px;cursor:pointer;}
    .seek-fill{height:100%;background:var(--accent);border-radius:3px;width:0;transition:width .08s linear;}
    .rate-grp{display:flex;gap:4px;}
    .rate-btn{padding:4px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;
              font-size:12px;color:var(--fg-soft);cursor:pointer;font-family:var(--font);
              font-variant-numeric:tabular-nums;}
    .rate-btn.active{background:var(--fg);color:#fff;border-color:var(--fg);}
    .replay-btn{padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;
                cursor:pointer;font-size:13px;color:var(--fg-soft);font-family:var(--font);
                display:flex;align-items:center;gap:5px;}
    .replay-btn:hover{background:var(--line-soft);color:var(--fg);}
    .replay-btn svg{width:14px;height:14px;}

    /* ── Instructions ── */
    .instr{padding:12px 16px;background:#f0f7ff;border:1px solid #c6e0ff;border-radius:8px;
           color:#0a4ea3;font-size:13px;margin-bottom:18px;line-height:1.6;}
    .instr b{font-weight:600;}
    .instr kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;
               border-radius:4px;padding:1px 5px;font-size:11px;font-family:var(--font);}

    /* ── Paragraph ── */
    .para{background:#fff;border:1px solid var(--line-soft);border-radius:12px;
          padding:24px 26px;line-height:2.2;font-size:17px;letter-spacing:.005em;
          min-height:200px;user-select:none;}
    .tk{padding:1px 2px;margin:0 1px;border-radius:4px;cursor:pointer;
        transition:background .12s,color .12s,box-shadow .12s;
        border-bottom:2px solid transparent;}
    .tk:hover{background:var(--line-soft);}
    .tk.current{background:var(--karaoke);box-shadow:0 0 0 1px #f3d76b inset;}
    .tk.marked{background:var(--red-bg);color:var(--red);border-bottom-color:var(--red);font-weight:600;}
    .tk.marked.current{background:#ffdcd8;}
    /* Result states (after submit) */
    .tk.hit{background:var(--green-bg);color:var(--green);border-bottom-color:var(--green-bd);font-weight:600;}
    .tk.miss{background:var(--red-bg);color:var(--red);border-bottom-color:var(--red);font-weight:600;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--red);}
    .tk.fp{background:var(--yellow-bg);color:var(--yellow);border-bottom-color:var(--yellow-bd);text-decoration:line-through;}
    .tk .reveal{font-size:13px;color:var(--green);font-weight:600;margin-left:3px;background:#fff;
                padding:0 5px;border-radius:4px;border:1px solid var(--green-bd);}
    .para.locked .tk{cursor:default;}
    .para.locked .tk:hover{background:transparent;}
    .para.locked .tk.current{background:var(--karaoke);}
    .para.locked .tk.marked{background:var(--red-bg);}
    .para.locked .tk.hit{background:var(--green-bg);}
    .para.locked .tk.miss{background:var(--red-bg);}
    .para.locked .tk.fp{background:var(--yellow-bg);}

    /* ── Controls ── */
    .controls{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
    .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;
         font-family:var(--font);font-size:14px;color:var(--fg);cursor:pointer;font-weight:500;
         transition:background .12s,transform .12s,border-color .12s;}
    .btn:hover{background:var(--line-soft);}
    .btn.primary{background:var(--fg);color:#fff;border-color:var(--fg);}
    .btn.primary:hover{background:#000;}
    .btn.ghost{background:transparent;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .controls .spacer{flex:1;}

    /* ── Result panel ── */
    .result{margin-top:20px;padding:16px 20px;border-radius:12px;border:1px solid var(--line-soft);
            background:var(--bg-alt);display:none;}
    .result.show{display:block;}
    .result-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .result-score{font-size:24px;font-weight:700;}
    .result-score.good{color:var(--green);}
    .result-score.bad{color:var(--red);}
    .result-meta{font-size:13px;color:var(--fg-soft);}
    .result-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;
                 margin-top:10px;font-size:13px;}
    .result-item{padding:8px 10px;border-radius:6px;background:#fff;border:1px solid var(--line-soft);}
    .result-item .from{color:var(--red);text-decoration:line-through;margin-right:4px;}
    .result-item .to{color:var(--green);font-weight:600;}
    .result-item.miss-item{border-color:var(--red-bd);}
    .result-item.fp-item{border-color:var(--yellow-bd);}
    .result-item.fp-item .from{color:var(--yellow);}

    /* ── Loading / empty ── */
    .loading{padding:40px;text-align:center;color:var(--fg-mute);font-size:14px;}

    /* ── Responsive ── */
    @media (max-width: 760px) {
      .layout{grid-template-columns:1fr;}
      .sidebar{position:static;height:auto;max-height:240px;border-right:none;
               border-bottom:1px solid var(--line-soft);}
      .main{padding:18px;}
      .para{font-size:16px;padding:18px;line-height:2;}
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">大骐英语</a>
    <span class="nav-sep">/</span>
    <a href="wfd.html" class="muted">WFD</a>
    <span class="nav-sep">·</span>
    <a href="hiw.html">HIW</a>
    <span class="nav-sep">/</span>
    <a href="courses.html" class="muted">课程</a>
    <div class="nav-right">
      <span class="badge">已练 <b id="navDone">0</b> / <b id="navTotal">0</b></span>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-hdr">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 7a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zm-.82 4.74a6 6 0 111.06-1.06l2.79 2.79a.75.75 0 11-1.06 1.06l-2.79-2.79z"/></svg>
          <input id="search" class="search" placeholder="搜索题目..." autocomplete="off" />
        </div>
      </div>
      <div class="sidebar-title">题库</div>
      <div class="topic-list" id="topicList"></div>
    </aside>

    <main class="main">
      <div id="mainContent">
        <div class="loading">加载中...</div>
      </div>
    </main>
  </div>

<script>
// ─────────── State ───────────
const state = {
  topics: [],        // 全部题目（来自 hiw_data.json）
  current: null,     // 当前题
  audio: null,       // <audio> 元素
  marked: new Set(), // 当前题：用户标记为"错词"的 word index
  submitted: false,  // 当前题是否已提交
  rafId: null,
  done: new Set(),   // localStorage 持久化：已完成的 topic id
  lastResult: {},    // topicId -> {hit, miss, fp}
};

const LS_KEY = "hiw_progress_v1";
function loadProgress() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    state.done = new Set(data.done || []);
    state.lastResult = data.lastResult || {};
  } catch (e) {}
}
function saveProgress() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      done: Array.from(state.done),
      lastResult: state.lastResult,
    }));
  } catch (e) {}
}

// ─────────── Boot ───────────
async function boot() {
  loadProgress();
  try {
    const res = await fetch("hiw_data.json");
    state.topics = await res.json();
  } catch (e) {
    document.getElementById("mainContent").innerHTML =
      `<div class="loading">题库加载失败：${e.message}<br><br>本地预览请用 <code>python3 -m http.server</code> 启动服务，不要直接双击打开。</div>`;
    return;
  }
  renderSidebar();
  // 默认加载第一题（或恢复上次浏览）
  const startId = parseInt(location.hash.replace("#", ""), 10);
  const start = state.topics.find(t => t.id === startId) || state.topics[0];
  loadTopic(start);
}

// ─────────── Sidebar ───────────
function renderSidebar(filter = "") {
  const list = document.getElementById("topicList");
  const f = filter.trim().toLowerCase();
  list.innerHTML = "";
  state.topics
    .filter(t => !f || t.title.toLowerCase().includes(f))
    .forEach(t => {
      const row = document.createElement("div");
      row.className = "topic-row" + (state.current?.id === t.id ? " active" : "")
                                  + (state.done.has(t.id) ? " done" : "");
      const status = state.done.has(t.id) ? "已练" : `${t.words.filter(w => w.m).length}处`;
      row.innerHTML = `
        <span class="t-num">#${t.id}</span>
        <span class="t-title">${escapeHtml(t.title)}</span>
        <span class="t-status">${status}</span>`;
      row.onclick = () => loadTopic(t);
      list.appendChild(row);
    });
  document.getElementById("navTotal").textContent = state.topics.length;
  document.getElementById("navDone").textContent = state.done.size;
}

document.getElementById("search").addEventListener("input", e => renderSidebar(e.target.value));

// ─────────── Topic load / render ───────────
function loadTopic(topic) {
  // Cleanup old
  if (state.audio) { state.audio.pause(); state.audio = null; }
  if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
  state.current = topic;
  state.marked = new Set();
  state.submitted = false;
  location.hash = String(topic.id);
  renderSidebar(document.getElementById("search").value);
  renderMain();
}

function renderMain() {
  const t = state.current;
  const diffPill = t.difficulty
    ? `<span class="pill ${t.difficulty}">${({easy:"简单",medium:"中等",hard:"困难"})[t.difficulty]||t.difficulty}</span>`
    : "";
  const totalMod = t.words.filter(w => w.m).length;

  document.getElementById("mainContent").innerHTML = `
    <div class="topic-hdr">
      <div class="topic-title">${escapeHtml(t.title)}</div>
      ${diffPill}
      <span class="pill">${totalMod} 处改动</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="sMarked">0</div><div class="stat-label">已标记</div></div>
      <div class="stat g"><div class="stat-num" id="sHit">—</div><div class="stat-label">命中</div></div>
      <div class="stat r"><div class="stat-num" id="sMiss">—</div><div class="stat-label">漏标</div></div>
      <div class="stat y"><div class="stat-num" id="sFp">—</div><div class="stat-label">误标</div></div>
    </div>

    <div class="audio-zone">
      <button class="play-btn" id="playBtn" aria-label="播放/暂停">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="audio-meta">
        <div>边听边在下面文本中点出与音频<b>不一致</b>的词</div>
        <div class="audio-time"><span id="curTime">0:00</span> / <span id="dur">0:00</span></div>
        <div class="seek-bar" id="seekBar"><div class="seek-fill" id="seekFill"></div></div>
      </div>
      <div class="rate-grp">
        <button class="rate-btn" data-rate="0.75">0.75×</button>
        <button class="rate-btn active" data-rate="1">1×</button>
        <button class="rate-btn" data-rate="1.25">1.25×</button>
      </div>
      <button class="replay-btn" id="replayBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        重听
      </button>
    </div>

    <div class="instr">
      <b>玩法：</b> 播放音频，文字会跟着高亮（卡拉OK跟读）。听到与屏幕上文字不同的地方，<b>点该词</b>标红。所有错词都找完后点"提交"看结果。<br>
      <b>快捷键：</b> <kbd>Space</kbd> 播放/暂停 &nbsp; <kbd>R</kbd> 重听 &nbsp; <kbd>Enter</kbd> 提交 &nbsp; <kbd>←</kbd> <kbd>→</kbd> 上/下一题
    </div>

    <div class="para" id="para"></div>

    <div class="controls">
      <button class="btn primary" id="submitBtn">提交</button>
      <button class="btn" id="revealBtn">显示答案</button>
      <button class="btn ghost" id="resetBtn">重置</button>
      <div class="spacer"></div>
      <button class="btn" id="prevBtn">← 上一题</button>
      <button class="btn" id="nextBtn">下一题 →</button>
    </div>

    <div class="result" id="result"></div>
  `;

  renderParagraph();
  setupAudio();
  setupControls();
}

function renderParagraph() {
  const para = document.getElementById("para");
  para.classList.toggle("locked", state.submitted);
  para.innerHTML = "";
  state.current.words.forEach(w => {
    const span = document.createElement("span");
    span.className = "tk";
    span.dataset.i = w.i;
    span.textContent = w.w;
    if (state.marked.has(w.i)) span.classList.add("marked");
    if (state.submitted) {
      const isMod = w.m;
      const marked = state.marked.has(w.i);
      if (isMod && marked) {
        span.classList.add("hit");
        span.title = `正确：音频说的是 "${w.a}"`;
      } else if (isMod && !marked) {
        span.classList.add("miss");
        span.title = `漏标：音频说的是 "${w.a}"`;
        const r = document.createElement("span");
        r.className = "reveal";
        r.textContent = w.a;
        span.appendChild(r);
      } else if (!isMod && marked) {
        span.classList.add("fp");
        span.title = "这个词其实是对的";
      }
    }
    span.addEventListener("click", () => onTokenClick(w.i));
    para.appendChild(span);
    para.appendChild(document.createTextNode(" "));
  });
}

function onTokenClick(i) {
  if (state.submitted) return;
  if (state.marked.has(i)) state.marked.delete(i);
  else state.marked.add(i);
  const span = document.querySelector(`.tk[data-i="${i}"]`);
  span.classList.toggle("marked");
  document.getElementById("sMarked").textContent = state.marked.size;
}

// ─────────── Audio + Karaoke ───────────
function setupAudio() {
  const audio = new Audio(`audio/${state.current.audio}`);
  audio.preload = "auto";
  state.audio = audio;

  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const curTime = document.getElementById("curTime");
  const dur = document.getElementById("dur");
  const seekFill = document.getElementById("seekFill");
  const seekBar = document.getElementById("seekBar");

  audio.addEventListener("loadedmetadata", () => { dur.textContent = fmtTime(audio.duration); });
  audio.addEventListener("play",  () => { playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; tick(); });
  audio.addEventListener("pause", () => { playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; });
  audio.addEventListener("ended", () => {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    if (state.rafId) cancelAnimationFrame(state.rafId);
    // Clear current highlight at end
    document.querySelectorAll(".tk.current").forEach(el => el.classList.remove("current"));
  });

  playBtn.onclick = togglePlay;
  document.getElementById("replayBtn").onclick = () => { audio.currentTime = 0; audio.play(); };
  seekBar.onclick = e => {
    const rect = seekBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
  };
  document.querySelectorAll(".rate-btn").forEach(b => {
    b.onclick = () => {
      audio.playbackRate = parseFloat(b.dataset.rate);
      document.querySelectorAll(".rate-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    };
  });

  function tick() {
    const t = audio.currentTime;
    curTime.textContent = fmtTime(t);
    if (audio.duration) seekFill.style.width = (t / audio.duration * 100) + "%";
    highlightCurrent(t);
    if (!audio.paused && !audio.ended) state.rafId = requestAnimationFrame(tick);
  }
}

let lastHighlightIdx = -1;
function highlightCurrent(t) {
  // Find word where t in [s, e]; binary-ish linear is fine for <500 words
  const ws = state.current.words;
  // Start search near last position to avoid O(n) every frame
  let idx = -1;
  const startSearch = (lastHighlightIdx >= 0 && lastHighlightIdx < ws.length && ws[lastHighlightIdx].s <= t)
    ? lastHighlightIdx : 0;
  for (let i = startSearch; i < ws.length; i++) {
    if (t >= ws[i].s && t <= ws[i].e) { idx = i; break; }
    if (ws[i].s > t) break;
  }
  if (idx === lastHighlightIdx) return;
  if (lastHighlightIdx >= 0) {
    const old = document.querySelector(`.tk[data-i="${lastHighlightIdx}"]`);
    if (old) old.classList.remove("current");
  }
  if (idx >= 0) {
    const cur = document.querySelector(`.tk[data-i="${idx}"]`);
    if (cur) {
      cur.classList.add("current");
      // Gentle auto-scroll to keep current word visible
      const rect = cur.getBoundingClientRect();
      if (rect.top < 80 || rect.bottom > window.innerHeight - 80) {
        cur.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
  }
  lastHighlightIdx = idx;
}

function togglePlay() {
  if (!state.audio) return;
  if (state.audio.paused) state.audio.play();
  else state.audio.pause();
}

function fmtTime(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const ss = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${ss}`;
}

// ─────────── Controls / submit ───────────
function setupControls() {
  document.getElementById("submitBtn").onclick = submit;
  document.getElementById("revealBtn").onclick = reveal;
  document.getElementById("resetBtn").onclick = reset;
  document.getElementById("prevBtn").onclick = () => jump(-1);
  document.getElementById("nextBtn").onclick = () => jump(+1);
}

function submit() {
  if (state.submitted) return;
  state.submitted = true;
  if (state.audio) state.audio.pause();
  const t = state.current;
  let hit = 0, miss = 0, fp = 0;
  const missItems = [], fpItems = [];
  t.words.forEach(w => {
    const marked = state.marked.has(w.i);
    if (w.m && marked) hit++;
    else if (w.m && !marked) { miss++; missItems.push(w); }
    else if (!w.m && marked) { fp++; fpItems.push(w); }
  });
  document.getElementById("sHit").textContent = hit;
  document.getElementById("sMiss").textContent = miss;
  document.getElementById("sFp").textContent = fp;
  renderParagraph();

  const totalMod = t.words.filter(w => w.m).length;
  const pct = totalMod ? Math.round(hit / totalMod * 100) : 100;
  const good = pct >= 80 && fp <= 1;
  const result = document.getElementById("result");
  result.classList.add("show");
  result.innerHTML = `
    <div class="result-hdr">
      <div class="result-score ${good ? 'good' : 'bad'}">${pct}%</div>
      <div class="result-meta">命中 ${hit}/${totalMod}　漏标 ${miss}　误标 ${fp}</div>
    </div>
    ${missItems.length ? `<div style="font-size:13px;color:var(--fg-soft);margin-top:8px">漏掉的：</div>
      <div class="result-list">${missItems.map(w => `
        <div class="result-item miss-item"><span class="from">${escapeHtml(w.w)}</span>→<span class="to">${escapeHtml(w.a)}</span></div>
      `).join("")}</div>` : ""}
    ${fpItems.length ? `<div style="font-size:13px;color:var(--fg-soft);margin-top:10px">点错的：</div>
      <div class="result-list">${fpItems.map(w => `
        <div class="result-item fp-item"><span class="from">${escapeHtml(w.w)}</span> 其实是对的</div>
      `).join("")}</div>` : ""}
  `;

  state.done.add(t.id);
  state.lastResult[t.id] = { hit, miss, fp, pct };
  saveProgress();
  renderSidebar(document.getElementById("search").value);
}

function reveal() {
  if (!state.submitted) submit();
}

function reset() {
  state.marked = new Set();
  state.submitted = false;
  lastHighlightIdx = -1;
  if (state.audio) { state.audio.pause(); state.audio.currentTime = 0; }
  renderMain();
}

function jump(delta) {
  const idx = state.topics.findIndex(t => t.id === state.current.id);
  const next = state.topics[idx + delta];
  if (next) loadTopic(next);
}

// ─────────── Shortcuts ───────────
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "r" || e.key === "R") {
    if (state.audio) { state.audio.currentTime = 0; state.audio.play(); }
  }
  else if (e.key === "Enter") { submit(); }
  else if (e.key === "ArrowLeft" && (e.metaKey || e.ctrlKey || !state.audio || state.audio.paused)) {
    // Only nav if not scrubbing audio
    if (e.metaKey || e.ctrlKey) { e.preventDefault(); jump(-1); }
  }
  else if (e.key === "ArrowRight" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); jump(+1);
  }
});

// ─────────── Utils ───────────
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

boot();
</script>
</body>
</html>

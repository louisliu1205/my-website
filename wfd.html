<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WFD 高频练习 — 大骐英语</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#fff; --bg-alt:#f6f8fa; --fg:#1f2328; --fg-soft:#59636e; --fg-mute:#848e98;
      --line:#d1d9e0; --line-soft:#eaeef2; --accent:#1f6feb;
      --green:#1a7f37; --green-bg:#dafbe1; --green-bd:#aceebb;
      --red:#cf222e;   --red-bg:#ffebe9;   --red-bd:#ffcecb;
      --yellow:#9a6700; --yellow-bg:#fff8c5;
      --radius:10px;
      --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--fg);
         font-size:15px;-webkit-font-smoothing:antialiased;}

    /* ── Nav ── */
    .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
         padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .nav a{color:var(--fg);font-weight:600;text-decoration:none;font-size:15px;}
    .nav-sep{color:var(--fg-mute);}
    .nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .badge{background:var(--bg-alt);border:1px solid var(--line);border-radius:20px;
           padding:3px 10px;font-size:13px;font-weight:500;color:var(--fg-soft);}
    .badge b{color:var(--fg);}

    /* ── Layout ── */
    .layout{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 50px);}

    /* ── Sidebar ── */
    .sidebar{border-right:1px solid var(--line-soft);padding:20px 0;background:var(--bg-alt);
             position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;}
    .sidebar-title{font-size:11px;font-weight:600;color:var(--fg-mute);letter-spacing:.08em;
                   text-transform:uppercase;padding:0 16px;margin-bottom:8px;}
    .cat-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;
             width:100%;padding:9px 16px;background:transparent;border:none;
             font-family:var(--font);font-size:14px;color:var(--fg-soft);
             cursor:pointer;text-align:left;transition:background .1s;}
    .cat-btn:hover{background:var(--line-soft);}
    .cat-btn.active{background:var(--line-soft);color:var(--fg);font-weight:600;}
    .cat-btn.active .cat-dot{background:var(--accent);}
    .cat-count{font-size:12px;color:var(--fg-mute);background:var(--bg);
               border:1px solid var(--line);border-radius:10px;padding:1px 7px;flex-shrink:0;}
    .sidebar-sep{height:1px;background:var(--line-soft);margin:8px 0;}

    /* ── Main ── */
    .main{padding:28px 32px 80px;max-width:720px;}

    /* ── Stats ── */
    .stats{display:flex;gap:12px;margin-bottom:24px;}
    .stat{flex:1;padding:12px 14px;border:1px solid var(--line-soft);border-radius:10px;text-align:center;}
    .stat-num{font-size:20px;font-weight:700;}
    .stat-label{font-size:12px;color:var(--fg-mute);margin-top:2px;}
    .stat.g .stat-num{color:var(--green);}
    .stat.r .stat-num{color:var(--red);}

    /* ── Progress ── */
    .progress-wrap{margin-bottom:24px;}
    .progress-meta{display:flex;justify-content:space-between;font-size:13px;
                   color:var(--fg-mute);margin-bottom:7px;}
    .progress-bar{height:3px;background:var(--line-soft);border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}

    /* ── Card ── */
    .card{border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;
          box-shadow:0 1px 4px rgba(31,35,40,.05);}
    .card-hdr{background:var(--bg-alt);padding:14px 20px;border-bottom:1px solid var(--line-soft);
              display:flex;align-items:center;gap:10px;}
    .q-tag{font-size:13px;font-weight:600;color:var(--fg-mute);}
    .q-id{font-size:12px;color:var(--fg-mute);}
    .cat-pill{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:20px;
              background:var(--line-soft);color:var(--fg-soft);}
    .card-body{padding:24px 20px;}

    /* ── Audio zone ── */
    .audio-zone{display:flex;align-items:center;gap:14px;padding:14px 18px;
                background:var(--bg-alt);border-radius:10px;border:1px solid var(--line-soft);
                margin-bottom:24px;}
    .play-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
              background:var(--fg);color:#fff;display:flex;align-items:center;justify-content:center;
              flex-shrink:0;transition:transform .15s,background .15s;}
    .play-btn:hover{background:#000;transform:scale(1.06);}
    .play-btn:disabled{background:var(--fg-mute);cursor:not-allowed;transform:none;}
    .play-btn svg{width:19px;height:19px;}
    .audio-info{flex:1;min-width:0;}
    .audio-hint{font-size:13px;color:var(--fg-mute);}
    .audio-status{font-size:12px;color:var(--accent);margin-top:3px;min-height:16px;}
    .play-cnt{font-size:12px;color:var(--fg-mute);white-space:nowrap;
              background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;}

    /* ── Live preview ── */
    .live-label{font-size:12px;color:var(--fg-mute);margin-bottom:6px;font-weight:500;}
    .live-box{min-height:34px;padding:8px 12px;background:var(--bg-alt);
              border:1px solid var(--line-soft);border-radius:8px;
              display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:14px;
              font-size:15px;}
    .live-box:empty::before{content:"你输入的词会在这里实时显示…";color:var(--fg-mute);font-size:13px;}
    .lw{padding:2px 7px;border-radius:5px;transition:background .1s,color .1s;}
    .lw-ok     {background:#d1f0d9;color:#116329;}
    .lw-bad    {background:var(--red-bg);color:var(--red);}
    .lw-typing {background:#f0f3ff;color:var(--accent);}

    /* ── Input ── */
    .input-label{font-size:13px;font-weight:500;color:var(--fg-soft);margin-bottom:7px;}
    textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:13px;
             font-size:16px;font-family:var(--font);resize:none;height:76px;outline:none;
             color:var(--fg);transition:border-color .15s;}
    textarea:focus{border-color:var(--accent);}
    textarea::placeholder{color:var(--fg-mute);}
    textarea:disabled{background:var(--bg-alt);color:var(--fg-soft);}

    /* ── Buttons ── */
    .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
    .btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
         border:1px solid transparent;cursor:pointer;transition:all .15s;font-family:var(--font);}
    .btn-primary{background:var(--fg);color:#fff;}
    .btn-primary:hover{background:#000;}
    .btn-ghost{background:transparent;color:var(--fg);border-color:var(--line);}
    .btn-ghost:hover{background:var(--bg-alt);}
    .btn-sm{padding:6px 13px;font-size:13px;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}

    /* ── Result ── */
    .result{margin-top:20px;padding:16px 18px;border-radius:10px;display:none;}
    .result.correct{background:var(--green-bg);border:1px solid var(--green-bd);}
    .result.partial{background:var(--yellow-bg);border:1px solid #f5ca00;}
    .result-title{font-weight:600;font-size:14px;margin-bottom:10px;}
    .result.correct .result-title{color:var(--green);}
    .result.partial  .result-title{color:var(--yellow);}
    .diff-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
    .dw{padding:2px 7px;border-radius:5px;font-size:15px;}
    .dw-ok  {background:#d1f0d9;color:#116329;}
    .dw-miss{background:var(--red-bg);color:var(--red);text-decoration:line-through;}
    .dw-extra{background:#fff3b0;color:#804400;}
    .result-ans{font-size:14px;color:var(--fg-soft);margin-top:8px;}
    .result-ans b{color:var(--fg);}
    .result-zh{font-size:13px;color:var(--fg-mute);margin-top:5px;}
    .result-legend{font-size:12px;color:var(--fg-mute);margin-top:8px;}

    /* ── Nav footer ── */
    .nav-footer{display:flex;align-items:center;gap:10px;margin-top:24px;}
    .nav-footer .sp{flex:1;}

    /* ── Responsive ── */
    @media(max-width:680px){
      .layout{grid-template-columns:1fr;}
      .sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line-soft);
               padding:12px 0;display:flex;flex-wrap:wrap;gap:4px;padding:10px;}
      .sidebar-title{display:none;}
      .sidebar-sep{display:none;}
      .cat-btn{width:auto;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;}
      .cat-btn.active{background:var(--fg);color:#fff;border-color:var(--fg);}
      .main{padding:20px 16px 60px;}
    }
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html">大骐英语</a>
  <span class="nav-sep">›</span>
  <span style="color:var(--fg-soft);font-size:14px;">WFD 高频练习</span>
  <div class="nav-right">
    <span class="badge">答对 <b id="b-correct">0</b></span>
    <span class="badge">答错 <b id="b-wrong">0</b></span>
    <span class="badge">完成 <b id="b-done">0</b> / <b id="b-total">—</b></span>
  </div>
</nav>

<div class="layout">
  <!-- Sidebar: category filter -->
  <aside class="sidebar">
    <div class="sidebar-title">话题场景</div>
    <button class="cat-btn active" data-cat="全部" onclick="setCategory('全部')">
      全部题目 <span class="cat-count" id="cnt-全部">178</span>
    </button>
    <div class="sidebar-sep"></div>
    <button class="cat-btn" data-cat="🏫 校园场所" onclick="setCategory('🏫 校园场所')">
      🏫 校园场所 <span class="cat-count" id="cnt-校园场所">—</span>
    </button>
    <button class="cat-btn" data-cat="📚 学习课程" onclick="setCategory('📚 学习课程')">
      📚 学习课程 <span class="cat-count" id="cnt-学习课程">—</span>
    </button>
    <button class="cat-btn" data-cat="🔬 科学实验" onclick="setCategory('🔬 科学实验')">
      🔬 科学实验 <span class="cat-count" id="cnt-科学实验">—</span>
    </button>
    <button class="cat-btn" data-cat="💊 健康生活" onclick="setCategory('💊 健康生活')">
      💊 健康生活 <span class="cat-count" id="cnt-健康生活">—</span>
    </button>
    <button class="cat-btn" data-cat="🌍 社会文化" onclick="setCategory('🌍 社会文化')">
      🌍 社会文化 <span class="cat-count" id="cnt-社会文化">—</span>
    </button>
    <button class="cat-btn" data-cat="🌿 环境科技" onclick="setCategory('🌿 环境科技')">
      🌿 环境科技 <span class="cat-count" id="cnt-环境科技">—</span>
    </button>
    <button class="cat-btn" data-cat="💼 职业商业" onclick="setCategory('💼 职业商业')">
      💼 职业商业 <span class="cat-count" id="cnt-职业商业">—</span>
    </button>
    <button class="cat-btn" data-cat="📝 综合其他" onclick="setCategory('📝 综合其他')">
      📝 综合其他 <span class="cat-count" id="cnt-综合其他">—</span>
    </button>
    <div class="sidebar-sep"></div>
    <button class="cat-btn" data-cat="❌ 错题" onclick="setCategory('❌ 错题')">
      ❌ 错题复习 <span class="cat-count" id="cnt-错题">0</span>
    </button>
    <div style="padding:10px 16px;margin-top:auto;">
      <button class="btn btn-ghost btn-sm" style="width:100%" onclick="shuffleQueue()">🔀 随机顺序</button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main">
    <div class="stats">
      <div class="stat g"><div class="stat-num" id="s-correct">0</div><div class="stat-label">答对</div></div>
      <div class="stat r"><div class="stat-num" id="s-wrong">0</div><div class="stat-label">答错</div></div>
      <div class="stat">  <div class="stat-num" id="s-pct">—</div>  <div class="stat-label">正确率</div></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="p-text">第 1 题</span>
        <span id="p-cat" style="color:var(--fg-mute)"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="p-fill" style="width:0"></div></div>
    </div>

    <div class="card">
      <div class="card-hdr">
        <span class="q-tag" id="q-num">第 1 题</span>
        <span class="q-id" id="q-id">#—</span>
        <span class="cat-pill" id="q-cat"></span>
      </div>
      <div class="card-body">

        <!-- Audio -->
        <div class="audio-zone">
          <button class="play-btn" id="play-btn" onclick="playAudio()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="audio-info">
            <div class="audio-hint">听音频，在下方输入听到的句子</div>
            <div class="audio-status" id="a-status"></div>
          </div>
          <div class="play-cnt">播放 <span id="play-times">0</span> 次</div>
        </div>

        <!-- Live preview -->
        <div class="live-label">实时反馈（每打完一个词按空格即可看到）</div>
        <div class="live-box" id="live-box"></div>

        <!-- Input -->
        <div class="input-label">听写输入：</div>
        <textarea id="ans-input"
          placeholder="输入听到的内容，打完每个词后按空格，错词立刻变红…"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </textarea>

        <div class="btn-row">
          <button class="btn btn-primary" id="check-btn" onclick="checkAnswer()">提交答案</button>
          <button class="btn btn-ghost btn-sm" onclick="revealAnswer()">显示答案</button>
          <button class="btn btn-ghost btn-sm" onclick="nextQ()">跳过 →</button>
        </div>

        <div class="result" id="result-box">
          <div class="result-title" id="r-title"></div>
          <div class="diff-row" id="r-diff"></div>
          <div class="result-ans" id="r-ans"></div>
          <div class="result-zh" id="r-zh"></div>
          <div class="result-legend">🟢 写对的词 &nbsp; 🔴 <s>漏写的词</s> &nbsp; 🟡 多写的词</div>
        </div>
      </div>
    </div>

    <div class="nav-footer">
      <button class="btn btn-ghost btn-sm" onclick="prevQ()">← 上一题</button>
      <span class="sp"></span>
      <button class="btn btn-ghost btn-sm" onclick="nextQ()">下一题 →</button>
    </div>
  </div>
</div>

<audio id="audio-el"></audio>

<script>
// ─── State ───────────────────────────────────────────────────────────
let WFD = [], queue = [], cursor = 0;
let correct = 0, wrong = 0, done = 0;
let wrongIds = new Set();
let answered = new Set();   // indices already answered
let playTimes = 0;
let currentCat = '全部';
let catCounts = {};

fetch('wfd_data.json')
  .then(r => r.json())
  .then(data => {
    WFD = data;
    // Count categories
    WFD.forEach(item => {
      catCounts[item.category] = (catCounts[item.category] || 0) + 1;
    });
    updateCatCounts();
    buildQueue();
    renderQ();
  });

// ─── Category ────────────────────────────────────────────────────────
function updateCatCounts() {
  const map = {
    '🏫 校园场所':'校园场所','📚 学习课程':'学习课程','🔬 科学实验':'科学实验',
    '💊 健康生活':'健康生活','🌍 社会文化':'社会文化','🌿 环境科技':'环境科技',
    '💼 职业商业':'职业商业','📝 综合其他':'综合其他'
  };
  for (const [cat, key] of Object.entries(map)) {
    const el = document.getElementById('cnt-' + key);
    if (el) el.textContent = catCounts[cat] || 0;
  }
  document.getElementById('cnt-全部').textContent = WFD.length;
}

function setCategory(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  buildQueue();
  renderQ();
}

function buildQueue() {
  if (currentCat === '全部') {
    queue = WFD.map((_, i) => i);
  } else if (currentCat === '❌ 错题') {
    queue = WFD.map((_, i) => i).filter(i => wrongIds.has(i));
    if (!queue.length) { alert('还没有错题！先做一些题目吧。'); queue = WFD.map((_,i)=>i); }
  } else {
    queue = WFD.map((_, i) => i).filter(i => WFD[i].category === currentCat);
  }
  cursor = 0;
  document.getElementById('b-total').textContent = queue.length;
}

function shuffleQueue() {
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  cursor = 0; renderQ();
}

// ─── Render ──────────────────────────────────────────────────────────
function renderQ() {
  if (!WFD.length || !queue.length) return;
  const item = WFD[queue[cursor]];

  document.getElementById('q-num').textContent = `第 ${cursor + 1} 题`;
  document.getElementById('q-id').textContent  = `#${item.id}`;
  document.getElementById('q-cat').textContent = item.category;
  document.getElementById('p-text').textContent = `第 ${cursor + 1} 题，共 ${queue.length} 题`;
  document.getElementById('p-fill').style.width = `${(cursor / queue.length) * 100}%`;

  const ta = document.getElementById('ans-input');
  ta.value = ''; ta.disabled = false;
  document.getElementById('check-btn').disabled = false;
  document.getElementById('result-box').style.display = 'none';
  document.getElementById('live-box').innerHTML = '';
  document.getElementById('a-status').textContent = '';
  playTimes = 0;
  document.getElementById('play-times').textContent = '0';

  // Audio
  const audio = document.getElementById('audio-el');
  const btn = document.getElementById('play-btn');
  if (item.audio) {
    audio.src = `audio/${item.audio}`;
    btn.disabled = false;
  } else {
    audio.src = '';
    btn.disabled = true;
    document.getElementById('a-status').textContent = '（此题暂无音频）';
  }
  ta.focus();
}

// ─── Audio ───────────────────────────────────────────────────────────
function playAudio() {
  const audio = document.getElementById('audio-el');
  audio.currentTime = 0; audio.play();
  playTimes++;
  document.getElementById('play-times').textContent = playTimes;
  document.getElementById('a-status').textContent = '▶ 播放中…';
  audio.onended = () => { document.getElementById('a-status').textContent = '✓ 播完了，开始听写'; };
}

// ─── Normalise ───────────────────────────────────────────────────────
function norm(s) {
  return s.toLowerCase().replace(/[.,!?;:'"()\[\]—–-]/g, '').replace(/\s+/g,' ').trim();
}

// ─── Live preview (real-time) ────────────────────────────────────────
const ta = document.getElementById('ans-input');
ta.addEventListener('input', function() {
  const val = this.value;
  if (!WFD.length || !queue.length) return;
  const item = WFD[queue[cursor]];
  const correctSet = new Set(norm(item.en).split(' '));

  // Split by space; last token is "in progress" if no trailing space
  const tokens = val.split(' ');
  const endsWithSpace = val.endsWith(' ');
  const completedWords = endsWithSpace ? tokens.filter(Boolean) : tokens.slice(0, -1).filter(Boolean);
  const typingWord = endsWithSpace ? '' : tokens[tokens.length - 1];

  let html = '';
  completedWords.forEach(w => {
    const n = norm(w);
    const cls = correctSet.has(n) ? 'lw-ok' : 'lw-bad';
    html += `<span class="lw ${cls}">${w}</span>`;
  });
  if (typingWord) {
    html += `<span class="lw lw-typing">${typingWord}</span>`;
  }
  document.getElementById('live-box').innerHTML = html;
});

// ─── Check answer ────────────────────────────────────────────────────
function checkAnswer() {
  const input = ta.value.trim();
  if (!input) { ta.focus(); ta.style.borderColor='var(--red)'; setTimeout(()=>ta.style.borderColor='',1000); return; }

  const idx = queue[cursor];
  const item = WFD[idx];
  const correctWords = norm(item.en).split(' ');
  const userWords    = norm(input).split(' ');
  const correctSet   = new Set(correctWords);
  const userSet      = new Set(userWords);

  // Score: correct words in user input (PTE-style, position-independent)
  let hits  = userWords.filter(w => correctSet.has(w)).length;
  let extra = userWords.filter(w => !correctSet.has(w)).length;
  const maxScore = correctWords.length;
  const score = Math.max(0, hits - extra);
  const perfect = norm(input) === norm(item.en);

  // Build diff
  const diffEl = document.getElementById('r-diff');
  diffEl.innerHTML = '';
  correctWords.forEach(w => {
    const span = document.createElement('span');
    span.className = 'dw ' + (userSet.has(w) ? 'dw-ok' : 'dw-miss');
    span.textContent = w;
    diffEl.appendChild(span);
  });
  userWords.forEach(w => {
    if (!correctSet.has(w)) {
      const span = document.createElement('span');
      span.className = 'dw dw-extra'; span.textContent = w;
      diffEl.appendChild(span);
    }
  });

  // Show result
  const box = document.getElementById('result-box');
  box.className = 'result ' + (perfect ? 'correct' : 'partial');
  box.style.display = 'block';
  document.getElementById('r-title').textContent = perfect
    ? '✓ 完全正确！满分！'
    : `得分 ${score} / ${maxScore}（共 ${correctWords.length} 个词）`;
  document.getElementById('r-ans').innerHTML = `<b>正确答案：</b>${item.en}`;
  document.getElementById('r-zh').textContent = item.zh ? `译文：${item.zh}` : '';

  // Track
  if (!answered.has(idx)) {
    answered.add(idx); done++;
    if (perfect) { correct++; }
    else { wrong++; wrongIds.add(idx); document.getElementById('cnt-错题').textContent = wrongIds.size; }
    updateStats();
  }
  ta.disabled = true;
  document.getElementById('check-btn').disabled = true;
}

function revealAnswer() {
  const item = WFD[queue[cursor]];
  ta.value = item.en; ta.disabled = true;
  ta.dispatchEvent(new Event('input'));
}

function updateStats() {
  document.getElementById('s-correct').textContent = correct;
  document.getElementById('b-correct').textContent = correct;
  document.getElementById('s-wrong').textContent   = wrong;
  document.getElementById('b-wrong').textContent   = wrong;
  document.getElementById('b-done').textContent    = done;
  document.getElementById('s-pct').textContent = done ? Math.round(correct/done*100)+'%' : '—';
}

// ─── Navigation ──────────────────────────────────────────────────────
function nextQ() {
  if (cursor < queue.length - 1) { cursor++; renderQ(); }
  else alert(`${currentCat === '全部' ? '本组' : currentCat}练习完成！错题数：${wrongIds.size}。\n可点击左侧"错题复习"重练错题。`);
}
function prevQ() { if (cursor > 0) { cursor--; renderQ(); } }

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey)   checkAnswer();
  if (e.key === 'ArrowRight' && e.ctrlKey) nextQ();
  if (e.key === 'ArrowLeft'  && e.ctrlKey) prevQ();
  if (e.key === ' ' && e.ctrlKey) { e.preventDefault(); playAudio(); }
});
</script>
</body>
</html>
